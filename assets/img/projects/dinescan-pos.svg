<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="40%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glowGacoan" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#ef4444" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGo" cx="80%" cy="70%" r="60%">
      <stop offset="0%" stop-color="#00add8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="accentOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00add8"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <rect width="800" height="450" fill="url(#glowGacoan)"/>
  <rect width="800" height="450" fill="url(#glowGo)"/>

  <!-- Subtle Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Left Main Screen: Customer QR Ordering View -->
  <g transform="translate(40, 35)">
    <!-- Outer Device / Tablet Frame -->
    <rect width="450" height="380" rx="24" fill="#0f172a" fill-opacity="0.85" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <rect width="450" height="380" rx="24" fill="none" stroke="#00add8" stroke-opacity="0.2" stroke-width="1"/>

    <!-- App Header -->
    <g transform="translate(24, 20)">
      <!-- Restaurant Logo / Icon -->
      <rect width="36" height="36" rx="10" fill="url(#accentOrange)"/>
      <text x="18" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">🍜</text>

      <text x="48" y="19" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="15" fill="#ffffff">DineScan SaaS</text>
      <text x="48" y="32" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Meja 12 • Self QR Dine-In</text>

      <!-- React SPA Badge -->
      <g transform="translate(210, 6)">
        <rect width="84" height="24" rx="12" fill="#0284c7" fill-opacity="0.15" stroke="#0ea5e9" stroke-opacity="0.4"/>
        <text x="42" y="16" font-family="'Inter', sans-serif" font-weight="700" font-size="10" fill="#38bdf8" text-anchor="middle">⚛️ React SPA</text>
      </g>

      <!-- Live WebSocket Badge -->
      <g transform="translate(302, 6)">
        <rect width="98" height="24" rx="12" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4"/>
        <circle cx="12" cy="12" r="4" fill="#10b981"/>
        <text x="22" y="16" font-family="'Inter', sans-serif" font-weight="600" font-size="10" fill="#34d399">Live Kitchen</text>
      </g>
    </g>

    <!-- Category Tabs -->
    <g transform="translate(24, 75)">
      <rect width="70" height="28" rx="14" fill="url(#accentOrange)"/>
      <text x="35" y="18" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#ffffff" text-anchor="middle">Semua</text>

      <rect x="78" width="95" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="125" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#cbd5e1" text-anchor="middle">Mie Pedas 🔥</text>

      <rect x="181" width="85" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="223" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#cbd5e1" text-anchor="middle">Dimsum</text>

      <rect x="274" width="85" height="28" rx="14" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.1"/>
      <text x="316" y="18" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#cbd5e1" text-anchor="middle">Minuman</text>
    </g>

    <!-- Menu Items Grid -->
    <!-- Item 1: Mie Gacoan Style -->
    <g transform="translate(24, 120)">
      <rect width="195" height="155" rx="16" fill="url(#glassCard)" stroke="#ffffff" stroke-opacity="0.1"/>
      <!-- Food thumbnail mock -->
      <rect x="12" y="12" width="171" height="68" rx="10" fill="#ea580c" fill-opacity="0.3"/>
      <text x="97" y="52" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle">🌶️🍜</text>
      <rect x="18" y="18" width="60" height="18" rx="9" fill="#ef4444"/>
      <text x="48" y="30" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">Level 1 - 8</text>

      <text x="12" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff">Mie Iblis Pedas</text>
      <text x="12" y="112" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Pangsit + Daging Cincang</text>
      <text x="12" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#f97316">Rp 14.500</text>

      <!-- Counter -->
      <rect x="130" y="118" width="54" height="24" rx="12" fill="#ea580c"/>
      <text x="142" y="134" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#ffffff">-</text>
      <text x="157" y="134" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#ffffff">2</text>
      <text x="172" y="134" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#ffffff">+</text>
    </g>

    <!-- Item 2: Dimsum Udang -->
    <g transform="translate(231, 120)">
      <rect width="195" height="155" rx="16" fill="url(#glassCard)" stroke="#ffffff" stroke-opacity="0.1"/>
      <rect x="12" y="12" width="171" height="68" rx="10" fill="#0284c7" fill-opacity="0.25"/>
      <text x="97" y="52" font-family="'Inter', sans-serif" font-size="28" text-anchor="middle">🥟✨</text>
      <rect x="18" y="18" width="55" height="18" rx="9" fill="#0284c7"/>
      <text x="45" y="30" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#ffffff" text-anchor="middle">Best Seller</text>

      <text x="12" y="98" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="12" fill="#ffffff">Siomay Udang Keju</text>
      <text x="12" y="112" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Isi 3 Pcs + Saus Asam Manis</text>
      <text x="12" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#38bdf8">Rp 12.000</text>

      <rect x="130" y="118" width="54" height="24" rx="12" fill="#0284c7"/>
      <text x="142" y="134" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#ffffff">-</text>
      <text x="157" y="134" font-family="'Inter', sans-serif" font-weight="800" font-size="11" fill="#ffffff">1</text>
      <text x="172" y="134" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#ffffff">+</text>
    </g>

    <!-- Bottom Floating Order Bar -->
    <g transform="translate(24, 295)">
      <rect width="402" height="62" rx="16" fill="#1e293b" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.2"/>
      <text x="20" y="27" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#94a3b8">3 Item Pesanan • Meja 12</text>
      <text x="20" y="47" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="16" fill="#ffffff">Rp 41.000</text>

      <!-- Submit Order Button -->
      <g transform="translate(230, 12)">
        <rect width="156" height="38" rx="12" fill="url(#accentOrange)"/>
        <text x="78" y="24" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">Kirim Pesanan ⚡</text>
      </g>
    </g>
  </g>

  <!-- Right Floating Screen: Kitchen Display System (KDS) & Architecture Specs -->
  <g transform="translate(515, 35)">
    <!-- KDS Header Card -->
    <rect width="245" height="185" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#00add8" stroke-opacity="0.3" stroke-width="1.5"/>

    <g transform="translate(18, 18)">
      <!-- React, Golang & Postgres Badges -->
      <rect width="55" height="22" rx="11" fill="#0284c7" fill-opacity="0.18" stroke="#0ea5e9" stroke-opacity="0.5"/>
      <text x="27" y="15" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#38bdf8" text-anchor="middle">REACT</text>

      <rect x="60" width="60" height="22" rx="11" fill="#00add8" fill-opacity="0.15" stroke="#00add8" stroke-opacity="0.4"/>
      <text x="90" y="15" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#38bdf8" text-anchor="middle">GOLANG</text>

      <rect x="125" width="72" height="22" rx="11" fill="#336791" fill-opacity="0.2" stroke="#336791" stroke-opacity="0.5"/>
      <text x="161" y="15" font-family="'Inter', sans-serif" font-weight="800" font-size="9" fill="#60a5fa" text-anchor="middle">POSTGRES</text>

      <text x="0" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="14" fill="#ffffff">Kitchen Display (KDS)</text>
      <text x="0" y="64" font-family="'Inter', sans-serif" font-weight="500" font-size="10" fill="#94a3b8">Real-time Order Dispatcher</text>

      <!-- Active Ticket Mock -->
      <g transform="translate(0, 76)">
        <rect width="209" height="72" rx="12" fill="#ffffff" fill-opacity="0.05" stroke="#10b981" stroke-opacity="0.3"/>
        <text x="12" y="20" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12" fill="#10b981">TIKET #1042 • MEJA 12</text>
        <text x="12" y="38" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#e2e8f0">2x Mie Iblis (Lvl 3) 🔥</text>
        <text x="12" y="54" font-family="'Inter', sans-serif" font-weight="500" font-size="11" fill="#cbd5e1">1x Siomay Udang Keju</text>
        <rect x="135" y="12" width="62" height="20" rx="10" fill="#f59e0b" fill-opacity="0.2"/>
        <text x="166" y="26" font-family="'Inter', sans-serif" font-weight="700" font-size="9" fill="#fbbf24" text-anchor="middle">MEMASAK</text>
      </g>
    </g>

    <!-- Bottom Specs Card: Goroutines & Performance -->
    <g transform="translate(0, 200)">
      <rect width="245" height="180" rx="20" fill="#0f172a" fill-opacity="0.9" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>
      <g transform="translate(18, 20)">
        <text x="0" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13" fill="#ffffff">Spesifikasi Arsitektur</text>
        
        <g transform="translate(0, 32)">
          <circle cx="6" cy="6" r="4" fill="#00add8"/>
          <text x="16" y="10" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#e2e8f0">Go Routines Concurrency</text>
          <text x="16" y="24" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#94a3b8">Handle 10.000+ request/detik</text>
        </g>

        <g transform="translate(0, 68)">
          <circle cx="6" cy="6" r="4" fill="#60a5fa"/>
          <text x="16" y="10" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#e2e8f0">PostgreSQL ACID Engine</text>
          <text x="16" y="24" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#94a3b8">Row-level locking &amp; Partitions</text>
        </g>

        <g transform="translate(0, 104)">
          <circle cx="6" cy="6" r="4" fill="#10b981"/>
          <text x="16" y="10" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#e2e8f0">Sub-20ms WebSocket Sync</text>
          <text x="16" y="24" font-family="'Inter', sans-serif" font-weight="400" font-size="10" fill="#94a3b8">Push langsung ke POS &amp; Printer</text>
        </g>
      </g>
    </g>
  </g>
</svg>

